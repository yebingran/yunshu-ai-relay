name: Import existing project history
on:
  push:
    paths: [.github/workflows/import-history.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Import original history without changing existing workflow files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch https://github.com/yebingran/yunsuguanai.git main
          git merge --allow-unrelated-histories --no-edit FETCH_HEAD
          git push origin HEAD:main

# Workflow files are seeded before the history import.
